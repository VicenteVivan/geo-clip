[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoclip"
version = "1.3.0"
description = "CLIP-inspired image and GPS encoders for worldwide image geolocalization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Vicente Vivanco", email = "vicente.vivancocepeda@ucf.edu" },
]
keywords = ["geolocation", "computer-vision", "clip", "pytorch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
demo = [
  "folium>=0.14,<1",
  "matplotlib>=3.7,<4",
]

[project.urls]
Homepage = "https://github.com/VicenteVivan/geo-clip"
Repository = "https://github.com/VicenteVivan/geo-clip"
Paper = "https://arxiv.org/abs/2309.16020"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["geoclip*"]
exclude = ["tests", "tests.*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
geoclip = [
  "images/*.png",
  "model/gps_gallery/*.csv",
  "model/weights/*.pth",
]

[tool.setuptools.exclude-package-data]
"*" = [
  "AGENTS.md", "agents.md", "**/AGENTS.md", "**/agents.md",
  "tests/*", "**/tests/*",
  "test_*.py", "**/test_*.py", "*_test.py", "**/*_test.py",
  "conftest.py", "**/conftest.py", "pytest.ini", "**/pytest.ini",
]
