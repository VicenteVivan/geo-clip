[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoclip"
version = "1.2.1"
description = "CLIP-inspired image and GPS encoders for worldwide image geolocalization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Vicente Vivanco", email = "vicente.vivancocepeda@ucf.edu" },
]
keywords = ["geolocation", "computer-vision", "clip", "pytorch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
demo = [
  "folium>=0.14,<1",
  "matplotlib>=3.7,<4",
]
test = [
  "pytest>=8,<10",
]

[project.urls]
Homepage = "https://github.com/VicenteVivan/geo-clip"
Repository = "https://github.com/VicenteVivan/geo-clip"
Paper = "https://arxiv.org/abs/2309.16020"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["geoclip*"]

[tool.setuptools.package-data]
geoclip = [
  "images/*.png",
  "model/gps_gallery/*.csv",
  "model/weights/*.pth",
]
