name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the release version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]

          expected_tag = f"v{version}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match {expected_tag!r}."
              )
          PY

      - name: Install release tools
        run: python -m pip install --disable-pip-version-check build==1.6.0 twine==7.0.0

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Verify distribution contents
        run: |
          python - <<'PY'
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          with open("pyproject.toml", "rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]

          dist = Path("dist")
          wheel = dist / f"geoclip-{version}-py3-none-any.whl"
          source = dist / f"geoclip-{version}.tar.gz"
          files = sorted(path for path in dist.iterdir() if path.is_file())
          if files != sorted([wheel, source]):
              raise SystemExit(f"Unexpected distribution files: {files}")

          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()
          with tarfile.open(source, "r:gz") as archive:
              source_names = archive.getnames()

          for archive_name, names in (("wheel", wheel_names), ("source", source_names)):
              if any(name.endswith(".ipynb") for name in names):
                  raise SystemExit(f"A notebook was included in the {archive_name} archive.")

          required_wheel_files = (
              "geoclip/images/Kauai.png",
              "geoclip/model/gps_gallery/coordinates_100K.csv",
              "geoclip/model/weights/image_encoder_mlp_weights.pth",
              "geoclip/model/weights/location_encoder_weights.pth",
              "geoclip/model/weights/logit_scale_weights.pth",
          )
          missing = [name for name in required_wheel_files if name not in wheel_names]
          if missing:
              raise SystemExit(f"Required package files are missing: {missing}")
          PY

      - name: Record distribution hashes
        run: sha256sum dist/*

      - name: Store verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/geoclip/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
